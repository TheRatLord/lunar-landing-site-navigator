        title: "NASA History: 50 Years Ago: Lunar Landing Sites Selected"
        locator: Sun angle 7-20 deg, slope < 2 deg, 3 x 5 mile landing areas
    params:
      launch_mass_kg: {value: 15103, unit: kg, basis: published, source: 0, note: "Apollo 11 LM-5, ascent + descent stages with propellant"}
      power_type: {value: silver-zinc batteries, basis: published, source: 0}
      antenna_height_m: {value: 6.0, unit: m, basis: derived, note: "1.5 m stage bottom + 1.7 m descent stage + about 2.8 m ascent stage; S-band dish atop the ascent stage. Derived, not published."}
      landing_area_m: {value: [4800, 8000], unit: m, basis: published, source: 1, note: "candidate landing areas 3 x 5 statute miles (rectangular area, length x width)"}
