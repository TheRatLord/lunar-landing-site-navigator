    launch_vehicle_id: soyuz-2
    launch_utc: "2023-08-10T23:10Z"
    landing_utc: "2023-08-19T11:57Z"
    outcome: failed_before_landing
    causes:
      - category: propulsion
        summary: "A maneuvering engine failed to shut down and burned 127 s instead of 84 s, putting the craft into the Moon before any landing attempt."
        site_related: false
    lessons:
      - "Pre-landing orbit maneuvers are a failure point independent of the chosen site."
    observed: {tipped: false, power_lost: false, impacted: true, landed_upright: false}
