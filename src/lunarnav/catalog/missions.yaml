  - id: slim
    name: "SLIM"
    confidence: medium
    sources:
      - url: https://en.wikipedia.org/wiki/Smart_Lander_for_Investigating_Moon
        title: "Wikipedia: SLIM"
        locator: infobox; lead; landing and failure sections
    site_id: slim
    lander_id: slim
    launch_vehicle_id: h-iia
    launch_utc: "2023-09-06T23:42:11Z"
    landing_utc: "2024-01-19T15:20Z"
    outcome: partial
    causes:
      - category: propulsion
        summary: "An engine nozzle was lost during descent; the lander came down on its side or nose with its solar panels facing away from the Sun."
        site_related: false
    lessons:
      - "Landing attitude decides which arrays see the Sun; a lander on its side may only get power when the Sun moves round."
    observed: {tipped: true, power_lost: true, impacted: false, landed_upright: false}
  - id: luna-25
    name: "Luna 25"
    confidence: medium
    sources:
