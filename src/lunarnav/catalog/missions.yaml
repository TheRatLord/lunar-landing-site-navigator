# Lunar landing attempts: outcome, causes and lessons.
# Every cause carries site_related: only site-related causes may count against a landing site.
# criterion_map: review criterion each cause category counts against (null: not a site matter).
criterion_map:
  slope_tipover: slope_tipover
  illumination_power: illumination_power
  terrain_navigation: terrain_navigation
  thermal: thermal
  comms: earth_link
  launch_vehicle: launch_slip
  propulsion: null
  gnc_software: null
  sensor: null
  other: null
entries:
  - id: im-1-odysseus
    name: "IM-1 Odysseus"
    confidence: medium
    sources:
      - url: https://en.wikipedia.org/wiki/IM-1
        title: "Wikipedia: IM-1 Odysseus"
        locator: infobox; lead; landing and failure sections
    site_id: im-1-odysseus
    lander_id: nova-c
    launch_vehicle_id: falcon-9
    launch_utc: "2024-02-15T06:05:37Z"
    landing_utc: "2024-02-22T23:23:53Z"
    outcome: partial
    causes:
      - category: sensor
        summary: "The laser rangefinder safety switch was not enabled before launch, so the altitude lasers did not work in descent; the team switched to NASA's NDL lidar."
        site_related: false
      - category: slope_tipover
        summary: "Without laser altimetry it landed faster than planned on a slope of about 12 degrees, beyond its design limit, broke a leg and tipped onto its side."
        site_related: true
    lessons:
      - "A lander touching down fast on a 12 degree slope can tip; slopes near the design limit leave no margin for a navigation fault."
      - "The tipped attitude cut data rates and power; the lander did not survive into the lunar night."
    observed: {tipped: true, power_lost: true, impacted: false, landed_upright: false}
  - id: im-2-athena
    name: "IM-2 Athena"
    confidence: medium
    sources:
      - url: https://en.wikipedia.org/wiki/IM-2
        title: "Wikipedia: IM-2 Athena"
        locator: infobox; lead; landing and failure sections
    notes: "Wikipedia gives 17:27 UTC in the landing section and 17:28:50 UTC in the infobox; the infobox time is used."
    site_id: im-2-athena
    lander_id: nova-c
    launch_vehicle_id: falcon-9
    launch_utc: "2025-02-27T00:16:30Z"
    landing_utc: "2025-03-06T17:28:50Z"
    outcome: failed_landing
    causes:
      - category: sensor
        summary: "The altimeter failed during landing and a dust plume obscured the laser rangefinder, so the computer had no accurate altitude."
        site_related: false
      - category: slope_tipover
        summary: "It struck a plateau, skidded, rolled and came to rest on its side inside a crater."
        site_related: true
      - category: illumination_power
        summary: "Lying sideways in a crater near the south pole, power generation was low; operations ended under 13 hours after landing."
        site_related: true
    lessons:
      - "Small craters and plateaus below the DEM resolution inside the ellipse can tip a tall lander."
      - "A tipped lander in a shadowed polar crater cannot keep its batteries charged."
    observed: {tipped: true, power_lost: true, impacted: false, landed_upright: false}
  - id: hakuto-r-m1
    name: "HAKUTO-R Mission 1"
    confidence: medium
    sources:
      - url: https://en.wikipedia.org/wiki/Hakuto-R_Mission_1
        title: "Wikipedia: HAKUTO-R Mission 1"
        locator: infobox; lead; landing and failure sections
    site_id: hakuto-r-m1
    launch_vehicle_id: falcon-9
    launch_utc: "2022-12-11T07:38Z"
    landing_utc: "2023-04-25T16:40Z"
    outcome: failed_landing
    causes:
      - category: gnc_software
        summary: "The onboard computer judged the radar altimeter faulty and ignored it, hovered about 5 km up until propellant ran out, then fell."
        site_related: false
      - category: terrain_navigation
        summary: "LABEL TO VERIFY: ispace attributed the altimeter rejection to the sudden altitude change when crossing the rim of Atlas crater; this is not on the Wikipedia page read."
        site_related: true
    lessons:
      - "A steep crater rim on the approach path produces an altitude step that navigation software may reject as a sensor fault."
    observed: {tipped: false, power_lost: false, impacted: true, landed_upright: false}
  - id: hakuto-r-m2
    name: "HAKUTO-R Mission 2 (Resilience)"
    confidence: medium
    sources:
      - url: https://en.wikipedia.org/wiki/Hakuto-R_Mission_2
        title: "Wikipedia: HAKUTO-R Mission 2 (Resilience)"
        locator: infobox; lead; landing and failure sections
    notes: "The impact time is not stated consistently on the page, so landing_utc is left empty; the impact date is 2025-06-05."
    site_id: hakuto-r-m2
    launch_vehicle_id: falcon-9
    launch_utc: "2025-01-15T06:11:39Z"
    outcome: failed_landing
    causes:
      - category: sensor
        summary: "ispace's analysis identified a laser range finder anomaly as the cause of the hard landing; contact was lost about 90 s before the projected landing."
        site_related: false
    lessons:
      - "Laser range finder performance on the final approach is a single point of failure for a soft landing."
    observed: {tipped: false, power_lost: false, impacted: true, landed_upright: false}
  - id: beresheet
    name: "Beresheet"
    confidence: medium
    sources:
      - url: https://en.wikipedia.org/wiki/Beresheet
        title: "Wikipedia: Beresheet"
        locator: infobox; lead; landing and failure sections
    site_id: beresheet
    launch_vehicle_id: falcon-9
    launch_utc: "2019-02-22T01:45Z"
    landing_utc: "2019-04-11T19:23Z"
    outcome: failed_landing
    causes:
      - category: sensor
        summary: "An IMU gyroscope failed during braking."
        site_related: false
      - category: gnc_software
        summary: "Restarting the second IMU triggered a reboot that shut the main engine down; it struck the surface at about 140 m/s."
        site_related: false
    lessons:
      - "Engine and avionics faults during braking end a landing regardless of the site."
    observed: {tipped: false, power_lost: false, impacted: true, landed_upright: false}
