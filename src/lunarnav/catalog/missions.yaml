    lander_id: vikram
    launch_vehicle_id: lvm3
    launch_utc: "2019-07-22T09:13:12Z"
    landing_utc: "2019-09-06T20:23Z"
    outcome: failed_landing
    causes:
      - category: gnc_software
        summary: "The failure analysis committee concluded a software glitch; the lander deviated from its trajectory below 2.1 km and crash-landed."
        site_related: false
    lessons:
      - "Guidance limits (attitude-rate caps, high thrust) can make a small landing area unreachable late in descent."
    observed: {tipped: false, power_lost: false, impacted: true, landed_upright: false}
