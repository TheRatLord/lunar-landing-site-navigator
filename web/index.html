<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Lunar Landing Site Navigator</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if (/^\/demo\/?$/.test(location.pathname)) {
        try {
          for (const key of ["lunarnav.scenario.draft", "lunarnav.alternatives", "lunarnav.compare"]) localStorage.removeItem(key);
          const search = JSON.parse(localStorage.getItem("lunarnav.plan-search.v2") || "{}");
          delete search.draft;
          localStorage.setItem("lunarnav.plan-search.v2", JSON.stringify(search));
        } catch {}
        history.replaceState(null, "", "/overview");
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
