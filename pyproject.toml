[project]
name = "lunarnav"
version = "0.1.0"
description = "Lunar landing site illumination, communication and replanning engine"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "numba>=0.60",
    "spiceypy>=6.0",
    "rasterio>=1.4",
    "httpx>=0.27",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "orjson>=3.10",
    "typer>=0.12",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
    "pillow>=10.4",
    "claude-agent-sdk>=0.1",
    "weasyprint>=70.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[project.scripts]
lunarnav = "lunarnav.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lunarnav"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B905"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.File", "fastapi.Path"]
