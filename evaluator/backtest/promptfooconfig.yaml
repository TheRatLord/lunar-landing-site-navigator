description: Blinded backtest of the lunarnav site review board against historical landings, with and without tools
prompts:
  - "{{mission_id}}"
providers:
  - id: file://backtest/provider.ts
    label: tools
    config:
      mode: tools
  - id: file://backtest/provider.ts
    label: baseline
    config:
      mode: baseline
tests: file://backtest/tests.ts
evaluateOptions:
  maxConcurrency: 1
